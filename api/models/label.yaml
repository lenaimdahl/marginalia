$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "label.yaml"
title: Label
description: A tag that can be attached to a book.
type: object
properties:
  id:
    type: string
    description: Unique identifier of the label.
  name:
    type: string
    description: Display name of the label.
  color:
    type: string
    description: Hex color code used to render the label, e.g. "#FF5733".
required:
  - id
  - name
  - color
additionalProperties: false
